name: Build JAR

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.zip' \
            -not -path './.git/*' \
            -not -path '*/build/*' \
            -print0 |
          while IFS= read -r -d '' f; do
            dest="${f%.zip}-extracted"
            mkdir -p "$dest"
            unzip -oq "$f" -d "$dest"
          done

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE=$(find . -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path './.git/*' \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No build.gradle or build.gradle.kts found."
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Build JAR
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build --no-daemon
          else
            echo "Gradle wrapper missing."
            exit 1
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Mod-JAR
          path: '**/build/libs/*.jar'
          if-no-files-found: error
